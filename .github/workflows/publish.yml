name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires a GitHub Environment named "npm-publish" with required reviewers
    # configured in repo settings. This adds a manual approval gate so a stolen
    # tag-push permission can't unilaterally trigger npm publish.
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ] && ! grep -q '"private": true' "$pkg/package.json"; then
              echo "Publishing $pkg"
              npm publish --workspace="$pkg" --access public
            fi
          done
