name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires a GitHub Environment named "npm-publish" with required reviewers
    # configured in repo settings. This adds a manual approval gate so a stolen
    # tag-push permission can't unilaterally trigger npm publish.
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ] && ! grep -q '"private": true' "$pkg/package.json"; then
              echo "Publishing $pkg"
              npm publish --workspace="$pkg" --access public
            fi
          done
